spring:
  application:
    name: neonpulse-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neonpulse}
    username: ${DB_USER:neonpulse}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:?set JWT_SECRET}
  ttl-minutes: 1440

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080
